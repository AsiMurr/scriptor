<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #07070f; padding: 40px; font-family: sans-serif; }
    h2 { color: #6060a0; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 24px; }
    .row { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 48px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .label { color: #6060a0; font-size: 12px; }
  </style>
</head>
<body>

<h2>Яркие окантовки</h2>
<div class="row">

  <!-- 1: Голубой cyan -->
  <div class="item">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="150" height="150">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0820"/>
        </linearGradient>
        <linearGradient id="m" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#b0a0ff"/><stop offset="100%" stop-color="#7C6FFF"/>
        </linearGradient>
      </defs>
      <rect x="10" y="10" width="180" height="180" rx="38" fill="url(#bg)" stroke="#00d4ff" stroke-width="3.5"/>
      <!-- корпус острый -->
      <rect x="80" y="44" width="40" height="64" rx="4" fill="url(#m)"/>
      <rect x="80" y="60" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="70" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="80" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="90" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <path d="M 66,110 Q 66,138 100,138 Q 134,138 134,110" fill="none" stroke="#9080ef" stroke-width="5" stroke-linecap="square"/>
      <rect x="97" y="138" width="6" height="13" fill="#9080ef"/>
      <rect x="76" y="150" width="48" height="6" rx="1" fill="#9080ef"/>
    </svg>
    <div class="label">1 — голубой</div>
  </div>

  <!-- 2: Розовый -->

      <rect x="80" y="44" width="40" height="64" rx="4" fill="url(#m2)"/>
      <rect x="80" y="60" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="70" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="80" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="80" y="90" width="40" height="3" fill="rgba(255,255,255,0.25)"/>
      <path d="M 66,110 Q 66,138 100,138 Q 134,138 134,110" fill="none" stroke="#9080ef" stroke-width="5" stroke-linecap="square"/>
      <rect x="97" y="138" width="6" height="13" fill="#9080ef"/>

    <div class="label">2 — розовый</div>

  <!-- 3: Зелёный -->

    </svg>

</div>
